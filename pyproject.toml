[project]
name = "lazylearnai"
version = "0.1.0"
description = "Base de LazyLearnAI con FastAPI, Jinja2 y NeoQuest"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

